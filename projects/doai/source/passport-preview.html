<!doctype html>

  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;}body{min-height:100svh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 28%,#fff 0%,#f2f2f0 48%,#e5e5e3 100%);font-family:Arial,Helvetica,sans-serif;color:#101113;padding:56px 24px;-webkit-font-smoothing:antialiased}
    main{width:min(100%,1080px)}
    .card{position:relative;isolation:isolate;width:100%;aspect-ratio:1.75;border-radius:43px;border:1px solid #bcc8d0;background:linear-gradient(115deg,rgba(255,255,255,.92),rgba(255,255,255,.32) 42%,rgba(214,220,225,.38) 77%,rgba(255,255,255,.8)),linear-gradient(175deg,#f2f3f3,#e0e3e6);box-shadow:inset 0 0 0 2px #ffffffd9,inset 0 0 0 5px #e2e8ed,inset 0 0 0 7px #ffffffbd,inset 0 0 15px 10px #fff9,0 28px 32px -25px #545b6666,0 70px 70px -68px #66747d99;overflow:hidden;container-type:inline-size}

    .grain{position:absolute;inset:0;opacity:.13;mix-blend-mode:multiply;pointer-events:none;z-index:2}
    .rim{position:absolute;inset:3px;border-radius:40px;border:1px solid #fff;box-shadow:inset -2px -1px 5px #9fc4e773,1px 1px 4px #fff;pointer-events:none}
    .content{position:relative;padding:7.3% 7.4% 4.1%;height:100%;display:flex;flex-direction:column}
    header{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.brand{width:31.5%}.logo{display:block;width:100%;height:auto}.passport{font-size:1.95cqw;letter-spacing:.64em;margin-top:12px;color:#62656a;line-height:1;padding-left:2px}
    .status{font-family:'SFMono-Regular',Consolas,monospace;font-size:1.65cqw;letter-spacing:.03em;display:flex;align-items:center;gap:12px;white-space:nowrap;padding-top:1px;color:#555b60}.dot{width:1.42cqw;height:1.42cqw;flex:none;border-radius:50%;background:#a8c6bb;box-shadow:inset 0 1px 2px #ffffff50}
    .identity{margin-top:auto;margin-bottom:5.1%;position:relative;z-index:1}.label{font-family:'SFMono-Regular',Consolas,monospace;font-size:1.55cqw;font-weight:400;letter-spacing:.18em;color:#65696e;line-height:1.4}.name{font-size:8.2cqw;line-height:1.08;letter-spacing:-.052em;font-weight:600;margin:10px 0 0 -4px}
    .identifier{position:relative;z-index:1}.hash{font-family:'SFMono-Regular',Consolas,monospace;font-size:1.9cqw;letter-spacing:.025em;margin-top:9px;color:#33383d}
    footer{display:flex;justify-content:space-between;border-top:1px solid #8c929880;padding-top:2%;margin-top:3.8%;font-family:'SFMono-Regular',Consolas,monospace;font-size:1.9cqw;letter-spacing:.025em;color:#41474c}
    .orbit{position:absolute;width:39%;height:61%;right:5.3%;top:20.5%;pointer-events:none;opacity:.8}.nfc{position:absolute;right:5.8%;bottom:19.5%;width:4.2%;color:#969fab}
    @media(max-width:600px){body{padding:24px 15px}.card{border-radius:23px}.card:before{inset:5px;border-radius:18px}.rim{border-radius:21px}.status{gap:5px}.passport{margin-top:7px}.name{margin-top:5px;margin-left:-1px}.hash{margin-top:5px}}
  </style>
